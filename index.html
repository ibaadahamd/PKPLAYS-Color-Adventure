<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#6bbcff"><title>PKPLAYS Color Adventure</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#80cfff;font-family:system-ui;color:white;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:10px;left:12px;font-weight:900;text-shadow:0 2px 3px #345;font-size:15px;pointer-events:none}.btn{position:absolute;bottom:18px;width:68px;height:68px;border-radius:22px;border:3px solid #fff8;background:#28467b99;color:white;font-size:30px;font-weight:900;touch-action:none;user-select:none}.left{left:15px}.right{left:92px}.jump{right:17px;background:#ed6689bb}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#10224dcc;text-align:center;padding:25px;gap:12px}.overlay h1{font-size:clamp(28px,7vw,52px);margin:0;color:#ffe27b;text-shadow:0 4px #bf6792}.overlay p{max-width:480px;margin:0;line-height:1.5}.play{font-size:22px;font-weight:900;border:0;border-radius:18px;padding:13px 35px;background:#ffcc50;color:#402e55}.hidden{display:none}.note{font-size:12px;opacity:.8}</style></head><body><canvas id="game"></canvas><div class="hud" id="hud"></div><button class="btn left" id="left">◀</button><button class="btn right" id="right">▶</button><button class="btn jump" id="jump">⬆</button><div class="overlay" id="overlay"><h1>🌈 PKPLAYS<br>COLOR ADVENTURE</h1><p>1000 levels • Coins • Enemies • Boss challenges • Offline play</p><button class="play" id="play">PLAY GAME</button><div class="note">Move ◀ ▶ • Jump ⬆ • Reach the flag 🚩</div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),overlay=document.getElementById('overlay'),play=document.getElementById('play');let W=0,H=0,scale=1,world=[],coins=[],enemies=[],goal=0,player,level=Math.max(1,Math.min(1000,+(localStorage.getItem('pkplays_level')||1))),totalCoins=+(localStorage.getItem('pkplays_coins')||0),camera=0,playing=false,dead=false,won=false,frame=0;const key={left:false,right:false,jump:false};function resize(){W=innerWidth;H=innerHeight;c.width=Math.round(W*devicePixelRatio);c.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);scale=Math.min(W/760,H/430);scale=Math.max(.72,scale)}addEventListener('resize',resize);resize();function rng(seed){let s=seed|0;return()=>{s=(Math.imul(s,1664525)+1013904223)|0;return(s>>>0)/4294967296}}function build(){const r=rng(level*9517+83);world=[];coins=[];enemies=[];camera=0;dead=false;won=false;let x=0;const n=7+Math.min(12,Math.floor(level/35));const groundY=325;for(let i=0;i<n;i++){const width=145+Math.floor(r()*105),gap=i===0?0:35+Math.floor(r()*Math.min(78,45+level/40));x+=gap;const y=groundY-(i>0?Math.floor(r()*3)*24:0);world.push({x,y,w:width,h:500});if(i>0){coins.push({x:x+width*.48,y:y-55,taken:false});if(i%3===1)coins.push({x:x+width*.7,y:y-90,taken:false});if(i%2===0)enemies.push({x:x+width*.55,y:y-24,base:x+width*.55,min:x+30,max:x+width-30,dir:r()>.5?1:-1,size:24,boss:level%10===0&&i===n-2})}x+=width}goal=x-45;player={x:35,y:groundY-34,w:26,h:34,vx:0,vy:0,on:false,health:3,inv:0};hud.textContent=''}function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}function circ(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function reset(){player.x=35;player.y=265;player.vx=player.vy=0;player.health--;player.inv=65;if(player.health<=0){dead=true;playing=false;show('TRY AGAIN','Level '+level+' • Keep going!','RETRY')}}function show(title,subtitle,button){overlay.classList.remove('hidden');overlay.querySelector('h1').textContent=title;overlay.querySelector('p').textContent=subtitle;play.textContent=button}function next(){if(level>=1000){playing=false;won=true;show('🏆 YOU WON!','You completed all 1000 levels!','PLAY AGAIN');return}level++;localStorage.setItem('pkplays_level',level);build()}function update(){frame++;if(!playing)return;const speed=3.5;player.vx=(key.right?speed:0)-(key.left?speed:0);if(key.jump&&player.on){player.vy=-11.4;player.on=false}player.vy=Math.min(13,player.vy+.48);player.x+=player.vx;player.x=Math.max(0,player.x);const oldBottom=player.y+player.h;player.y+=player.vy;player.on=false;for(const p of world){if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldBottom<=p.y+7&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.on=true}}if(player.y>H/scale+270)reset();for(const coin of coins){if(!coin.taken&&Math.hypot(player.x+13-coin.x,player.y+16-coin.y)<26){coin.taken=true;totalCoins++;localStorage.setItem('pkplays_coins',totalCoins)}}for(const e of enemies){e.x+=e.dir*(e.boss?1.35:.75);if(e.x<e.min||e.x>e.max)e.dir*=-1;if(player.inv>0)continue;const b={x:e.x-e.size/2,y:e.y-e.size/2,w:e.size,h:e.size};if(collide(player,b)){if(player.vy>1&&player.y+player.h-10<e.y){e.dead=true;player.vy=-7;totalCoins+=e.boss?10:2;localStorage.setItem('pkplays_coins',totalCoins)}else reset()}}enemies=enemies.filter(e=>!e.dead);if(player.inv>0)player.inv--;if(player.x>goal-10){next()}camera=Math.max(0,player.x-W/scale*.28);hud.textContent='🌈 LEVEL '+level+'/1000   🪙 '+totalCoins+'   ❤️ '+player.health+(level%10===0?'   👑 BOSS LEVEL':'')}
function draw(){ctx.clearRect(0,0,W,H);const s=scale;ctx.save();ctx.scale(s,s);const vw=W/s,vh=H/s;const palette=['#79caff','#f7a8d8','#91d7b0','#b4a1ef','#ffc587'];const sky=palette[Math.floor((level-1)/100)%palette.length];rect(0,0,vw,vh,sky);for(let i=0;i<9;i++){let x=((i*231-camera*.17)%(vw+280)+vw+280)%(vw+280)-100,y=55+i%3*54;circ(x,y,27,'#ffffff9c');circ(x+25,y+7,33,'#ffffff9c');circ(x+52,y,24,'#ffffff9c')}for(let i=0;i<14;i++){let x=((i*170-camera*.34)%(vw+240)+vw+240)%(vw+240)-80;circ(x,vh+40,95,i%2?'#5ab98b':'#75d9a3')}ctx.save();ctx.translate(-camera,0);for(const p of world){rect(p.x,p.y,p.w,p.h,'#aa724b');rect(p.x,p.y,p.w,13,'#59cc6c');rect(p.x,p.y+12,p.w,5,'#3e9d51');for(let x=p.x+18;x<p.x+p.w-10;x+=34)circ(x,p.y+37,4,'#e7aa70')}for(const coin of coins)if(!coin.taken){circ(coin.x,coin.y+Math.sin(frame*.08)*4,11,'#ffe05e');circ(coin.x,coin.y+Math.sin(frame*.08)*4,6,'#ffb12d')}for(const e of enemies){circ(e.x,e.y,e.size/2,e.boss?'#9d4ce0':'#e94f6c');circ(e.x-5,e.y-3,3,'white');circ(e.x+5,e.y-3,3,'white');circ(e.x-5,e.y-3,1.5,'#283b63');circ(e.x+5,e.y-3,1.5,'#283b63');if(e.boss){ctx.font='23px sans-serif';ctx.fillText('👑',e.x-14,e.y-13)}}rect(goal,195,6,130,'#f7f7f7');ctx.fillStyle='#ff598b';ctx.beginPath();ctx.moveTo(goal+6,195);ctx.lineTo(goal+62,210);ctx.lineTo(goal+6,229);ctx.fill();if(player.inv%8<4){rect(player.x,player.y+12,player.w,player.h-12,'#4b75e8');rect(player.x+3,player.y+4,player.w-6,19,'#ffe0ad');rect(player.x-3,player.y,player.w+6,9,'#ec5c62');rect(player.x+17,player.y+11,3,4,'#34364f');rect(player.x+2,player.y+player.h-5,9,6,'#593a65');rect(player.x+16,player.y+player.h-5,9,6,'#593a65')}ctx.restore();ctx.restore();requestAnimationFrame(loop)}function loop(){update();draw()}function bind(id,k){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();key[k]=true;el.setPointerCapture(e.pointerId)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(evt,e=>{e.preventDefault();key[k]=false})}bind('left','left');bind('right','right');bind('jump','jump');addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')key.left=true;if(e.key==='ArrowRight'||e.key==='d')key.right=true;if(['ArrowUp',' ','w'].includes(e.key) )key.jump=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')key.left=false;if(e.key==='ArrowRight'||e.key==='d')key.right=false;if(['ArrowUp',' ','w'].includes(e.key))key.jump=false});play.onclick=()=>{if(won){level=1;totalCoins=0;localStorage.setItem('pkplays_level',1);localStorage.setItem('pkplays_coins',0)}build();playing=true;overlay.classList.add('hidden')};build();requestAnimationFrame(loop)})();
</script></body></html>
